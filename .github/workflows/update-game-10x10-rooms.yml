name: Update game 10x10 rooms

on:
  push:
    branches: [ main ]
    paths:
      - 'tools/update_game_10x10_rooms.py'
      - '.github/workflows/update-game-10x10-rooms.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Patch game and teacher summary
        run: python tools/update_game_10x10_rooms.py

      - name: Validate JavaScript syntax
        run: |
          python - <<'PY'
          import re
          from pathlib import Path
          for f in ['index.html','teacher-summary.html']:
              text=Path(f).read_text(encoding='utf-8')
              scripts=re.findall(r'<script>(.*?)</script>',text,re.S)
              if scripts:
                  Path('/tmp/check.js').write_text(scripts[-1],encoding='utf-8')
                  import subprocess
                  subprocess.run(['node','--check','/tmp/check.js'],check=True)
              print(f,'OK')
          PY

      - name: Commit updated pages
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html teacher-summary.html WPA_Submission/media/AI-Hand-Quest-final.html WPA_Submission/media/AI-Hand-Quest-teacher-summary.html
          if git diff --cached --quiet; then
            echo 'No changes to commit'
          else
            git commit -m 'Update AI Hand Quest to 10 pre/post questions and rooms 1-13'
            git push
          fi
