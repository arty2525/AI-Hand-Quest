['หากผล Prediction สลับระหว่าง Hand และ No Hand บ่อย แม้ว่าผู้ใช้ถือมือคงที่ วิธีใดเหมาะสมที่สุด?',['เพิ่มข้อมูลฝึกที่หลากหลาย และใช้ Confidence Threshold ร่วมกับ Stable Frames','ลบข้อมูลฝึกส่วนใหญ่','ส่ง /on และ /off พร้อมกันทุกครั้ง'],0]];
const conn=[[0,1],[1,2],[2,3],[3,4],[0,5],[5,6],[6,7],[7,8],[5,9],[9,10],[10,11],[11,12],[9,13],[13,14],[14,15],[15,16],[13,17],[17,18],[18,19],[19,20],[0,17]];
const wrap=document.getElementById('wrap'),v=document.getElementById('cam'),c=document.getElementById('cv'),x=c.getContext('2d'),start=document.getElementById('start'),msg=document.getElementById('msg'),actions=document.getElementById('actions');
let S='START',i=0,pre=0,post=0,score=0,attempt=0,total=0,first=0,hand=0,lm=null,tx=0,ty=0,cx=0,cy=0,pinch=0,oldPinch=0,grab=null,cards=[],zone={},btn={},lock=0,mouse=0,mgrab=null,control='Mouse',id={};
const ON=.055,OFF=.075; function W(){return wrap.clientWidth}function H(){return wrap.clientHeight}
function size(){let d=Math.min(devicePixelRatio||1,2);c.width=W()*d;c.height=H()*d;x.setTransform(d,0,0,d,0,0);zone={x:W()*.23,y:H()*.77,w:W()*.54,h:H()*.14}}addEventListener('resize',size);size();
function rr(a,b,w,h,r){x.beginPath();x.roundRect(a,b,w,h,r)}function panel(a,b,w,h){rr(a,b,w,h,20);x.fillStyle='#0f172ac7';x.fill();x.strokeStyle='#ffffff30';x.stroke()}function inside(px,py,r){return px>=r.x&&px<=r.x+r.w&&py>=r.y&&py<=r.y+r.h}
function text(t,a,b,m,l=27){let z='',ys=b;x.textAlign='center';for(const q of t.split(' ')){let n=z?z+' '+q:q;if(x.measureText(n).width>m&&z){x.fillText(z,a,ys);ys+=l;z=q}else z=n}x.fillText(z,a,ys)}
function data(){return S==='PRE'?PRE:S==='POST'?POST:GAME}function q(){return data()[i]}
function load(){let d=q(),cw=Math.min(245,W()*.25),ch=Math.min(160,H()*.24),g=W()*.025,b=(W()-(cw*3+g*2))/2,y=H()*.39;cards=d[1].map((t,k)=>({t,ok:k===d[2],x:b+k*(cw+g),y,w:cw,h:ch,ox:b+k*(cw+g),oy:y})).sort(()=>Math.random()-.5);cards.forEach((o,k)=>{o.x=o.ox=b+k*(cw+g)});attempt=0;grab=mgrab=null;lock=0}
function cur(){for(let k=cards.length-1;k>=0;k--)if(inside(cx,cy,cards[k]))return cards[k]}
function answer(o){if(lock)return;if(S==='PRE'||S==='POST'){lock=1;if(o.ok)S==='PRE'?pre++:post++;setTimeout(()=>{i++;if(i>=data().length){if(S==='PRE'){S='INTRO'}else{S='END';actions.classList.remove('hidden');actions.classList.add('flex')}i=0}else load()},350);return}
attempt++;total++;if(o.ok){lock=1;score+=Math.max(60,100-(attempt-1)*20);if(attempt===1)first++;setTimeout(()=>{i++;if(i>=GAME.length){S='PRACTICAL';i=0}else load()},800)}}
function release(o){if(!o)return;if(inside(o.x+o.w/2,o.y+o.h/2,zone))answer(o);else{o.x=o.ox;o.y=o.oy}}
function startGame(){S='GAME';i=0;score=0;total=0;first=0;load()}function startPost(){S='POST';i=0;post=0;load()}
async function init(){id={name:document.getElementById('nm').value||'-',no:document.getElementById('no').value||'-',group:document.getElementById('gp').value};start.classList.add('hidden');msg.classList.remove('hidden');try{let h=new Hands({locateFile:f=>`https://cdn.jsdelivr.net/npm/@mediapipe/hands/${f}`});h.setOptions({maxNumHands:1,modelComplexity:1,minDetectionConfidence:.6,minTrackingConfidence:.6,selfieMode:false});h.onResults(r=>{if(r.multiHandLandmarks?.length){lm=r.multiHandLandmarks[0];hand=1;let a=lm[8],b=lm[4];tx=(1-a.x)*W();ty=a.y*H();let dx=b.x-a.x,dy=b.y-a.y,d=Math.sqrt(dx*dx+dy*dy);if(!pinch&&d<ON)pinch=1;else if(pinch&&d>OFF)pinch=0}else{lm=null;hand=0;pinch=0}});let cam=new Camera(v,{onFrame:async()=>await h.send({image:v}),width:1280,height:720});await cam.start()}catch(e){}msg.classList.add('hidden');S='PRE';i=0;load()}document.getElementById('go').onclick=init;
function handAct(){if(!hand||mouse||lock){oldPinch=pinch;return}cx+=(tx-cx)*.3;cy+=(ty-cy)*.3;control='Hand';let down=pinch&&!oldPinch,up=!pinch&&oldPinch;if(down){if(S==='INTRO'&&inside(cx,cy,btn))startGame();else if(S==='PRACTICAL'&&inside(cx,cy,btn))startPost();else if(['PRE','GAME','POST'].includes(S)){grab=cur()||null}}if(grab&&pinch){grab.x=cx-grab.w/2;grab.y=cy-grab.h/2}if(up&&grab){release(grab);grab=null}oldPinch=pinch}
function P(e){let r=c.getBoundingClientRect();return{x:e.clientX-r.left,y:e.clientY-r.top}}c.onpointerdown=e=>{let p=P(e);mouse=1;cx=p.x;cy=p.y;control=e.pointerType==='touch'?'Touch':'Mouse';if(S==='INTRO'&&inside(cx,cy,btn))startGame();else if(S==='PRACTICAL'&&inside(cx,cy,btn))startPost();else if(['PRE','GAME','POST'].includes(S)){mgrab=cur()||null}};c.onpointermove=e=>{let p=P(e);cx=p.x;cy=p.y;if(mouse&&mgrab){mgrab.x=cx-mgrab.w/2;mgrab.y=cy-mgrab.h/2}};c.onpointerup=()=>{if(mgrab){release(mgrab);mgrab=null}mouse=0};
function bg(){if(!v.srcObject){let g=x.createLinearGradient(0,0,W(),H());g.addColorStop(0,'#07152e');g.addColorStop(1,'#28114c');x.fillStyle=g;x.fillRect(0,0,W(),H())}else{x.fillStyle='#02061740';x.fillRect(0,0,W(),H())}}
function skeleton(){if(!lm)return;x.strokeStyle='#22d3ee';x.lineWidth=3;for(let [a,b] of conn){x.beginPath();x.moveTo((1-lm[a].x)*W(),lm[a].y*H());x.lineTo((1-lm[b].x)*W(),lm[b].y*H());x.stroke()}for(let k=0;k<lm.length;k++){x.beginPath();x.arc((1-lm[k].x)*W(),lm[k].y*H(),k===4||k===8?6:4,0,7);x.fillStyle=k===4||k===8?'#fde047':'#67e8f9';x.fill()}}
function cursor(){if(!hand||mouse)return;let h=cur();x.beginPath();x.arc(cx,cy,20,0,7);x.lineWidth=4;x.strokeStyle=grab?'#22c55e':h?'#fde047':'#38bdf8';if(h&&!grab)x.setLineDash([7,6]);x.stroke();x.setLineDash([])}
function quiz(t){let d=q();panel(W()*.09,65,W()*.82,105);x.fillStyle='#e0f2fe';x.font=`800 ${Math.max(17,W()*.019)}px sans-serif`;text(d[0],W()/2,108,W()*.72,29);cards.forEach(o=>{panel(o.x,o.y,o.w,o.h);x.fillStyle='#fff';x.font=`800 ${Math.max(14,o.w*.065)}px sans-serif`;text(o.t,o.x+o.w/2,o.y+o.h*.55,o.w*.85,22)});x.setLineDash([10,8]);rr(zone.x,zone.y,zone.w,zone.h,22);x.strokeStyle='#67e8f9';x.lineWidth=2;x.stroke();x.setLineDash([]);x.fillStyle='#cffafe';x.font='800 20px sans-serif';x.textAlign='center';x.fillText('🎯 วางคำตอบที่นี่',W()/2,zone.y+zone.h*.58);x.fillStyle='#fff';x.font='700 14px sans-serif';x.fillText(S==='GAME'?`ด่าน ${i+1}/10  ⭐ ${score}/1000`:S==='PRE'?`ก่อนเรียน ${i+1}/5`:`หลังเรียน ${i+1}/10`,W()/2,35)}
function intro(){panel(W()*.15,H()*.12,W()*.7,H()*.66);x.textAlign='center';x.fillStyle='#fff';x.font='900 34px sans-serif';x.fillText(`ก่อนเรียน ${pre}/5`,W()/2,H()*.22);x.fillStyle='#e2e8f0';x.font='700 18px sans-serif';['ใช้มือจีบหรือ Mouse ลากคำตอบ','เกม 10 ด่านมี Feedback เพื่อพัฒนาความเข้าใจ','หลังเกมทำภารกิจปฏิบัติจริงร่วมกับกลุ่ม'].forEach((s,k)=>x.fillText('• '+s,W()/2,H()*(.34+k*.08)));btn={x:W()*.36,y:H()*.65,w:W()*.28,h:H()*.09};rr(btn.x,btn.y,btn.w,btn.h,18);x.fillStyle='#16a34a';x.fill();x.fillStyle='#fff';x.font='900 22px sans-serif';x.fillText('เริ่มเกม 🚀',W()/2,btn.y+btn.h*.62)}
function practical(){panel(W()*.08,H()*.08,W()*.84,H()*.78);x.textAlign='center';x.fillStyle='#fff';x.font='900 30px sans-serif';x.fillText('🤝 Collaborative Performance Mission',W()/2,H()*.16);x.font='700 16px sans-serif';x.fillStyle='#a5f3fc';x.fillText(`กลุ่ม ${id.group} • 5 คน • อุปกรณ์ 3 ชุด`,W()/2,H()*.21);let a=[['🧠 AI Station','แสดง Hand/No Hand และอธิบาย Prediction'],['💡 ESP32 Station','ทดสอบ /on /off ให้ LED ติด–ดับ'],['🔗 Integration','สาธิต Hand → AI → HTTP → ESP32 → LED'],['🔎 Challenge','วิเคราะห์ปัญหา พร้อมหลักฐานและวิธีแก้']];a.forEach((q,k)=>{let xx=k%2?W()*.52:W()*.11,yy=k<2?H()*.28:H()*.49;panel(xx,yy,W()*.37,H()*.16);x.textAlign='left';x.fillStyle='#fde68a';x.font='800 18px sans-serif';x.fillText(q[0],xx+15,yy+35);x.fillStyle='#e2e8f0';x.font='600 14px sans-serif';x.fillText(q[1],xx+15,yy+68)});btn={x:W()*.35,y:H()*.72,w:W()*.3,h:H()*.08};rr(btn.x,btn.y,btn.w,btn.h,18);x.fillStyle='#7c3aed';x.fill();x.fillStyle='#fff';x.textAlign='center';x.font='900 20px sans-serif';x.fillText('ทำแบบหลังเรียน ✅',W()/2,btn.y+btn.h*.62)}
function end(){let pct=Math.round((post/POST.length)*100),passed=pct>=70,prePct=Math.round((pre/PRE.length)*100),gain=pct-prePct;panel(W()*.10,H()*.07,W()*.80,H()*.74);x.textAlign='center';x.fillStyle='#fde68a';x.font='900 34px sans-serif';x.fillText('🎉 สรุปผลการประเมินท้ายหน่วย',W()/2,H()*.16);x.fillStyle='#fff';x.font='700 16px sans-serif';x.fillText(`${id.name} • เลขที่ ${id.no} • กลุ่ม ${id.group}`,W()/2,H()*.215);x.fillStyle='#fbbf24';x.font='900 24px sans-serif';x.fillText(`ก่อนเรียน ${pre}/${PRE.length} (${prePct}%)`,W()*.28,H()*.33);x.fillStyle='#86efac';x.fillText(`Post-test ${post}/${POST.length} (${pct}%)`,W()*.60,H()*.33);x.fillStyle=passed?'#86efac':'#fca5a5';x.font='900 36px sans-serif';x.fillText(passed?'✅ ผ่านเกณฑ์':'❌ ไม่ผ่านเกณฑ์',W()/2,H()*.44);x.font='800 17px sans-serif';x.fillText(`เกณฑ์ผ่าน 70% • ต้องได้อย่างน้อย 7/10`,W()/2,H()*.49);x.fillStyle='#67e8f9';x.font='800 19px sans-serif';x.fillText(`พัฒนาการ ${gain>=0?'+':''}${gain} จุดเปอร์เซ็นต์`,W()/2,H()*.56);x.fillStyle='#c4b5fd';x.font='800 20px sans-serif';x.fillText(`คะแนนเกม ${score}/1000`,W()/2,H()*.62);x.fillStyle='#e2e8f0';x.font='700 15px sans-serif';x.fillText(`ตอบถูกครั้งแรก ${first}/10 • พยายาม ${total} ครั้ง`,W()/2,H()*.68);x.font='600 13px sans-serif';x.fillText('สามารถดาวน์โหลดผลเป็น CSV หรือกด Exit เพื่อออกจากเกม',W()/2,H()*.74)}
function loop(t){x.clearRect(0,0,W(),H());bg();handAct();if(['PRE','GAME','POST'].includes(S))quiz(t);else if(S==='INTRO')intro();else if(S==='PRACTICAL')practical();else if(S==='END')end();skeleton();cursor();requestAnimationFrame(loop)}requestAnimationFrame(loop);
document.getElementById('csv').onclick=()=>{let pct=Math.round((post/POST.length)*100),prePct=Math.round((pre/PRE.length)*100),passed=pct>=70?'ผ่าน':'ไม่ผ่าน';let row=['timestamp','name','no','group','pre_score','pre_percent','post_10','post_percent','pass_70','gain_percentage_points','game_1000','first_try_10','attempts','control'].join(',')+'\n'+[new Date().toISOString(),id.name,id.no,id.group,pre,prePct,post,pct,passed,pct-prePct,score,first,total,control].map(v=>`"${String(v).replaceAll('"','""')}"`).join(',');let b=new Blob(['\ufeff'+row],{type:'text/csv'}),a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=`AIHQ_G${id.group}_${id.no}.csv`;a.click()};
document.getElementById('exitBtn').onclick=()=>{try{const stream=v.srcObject;if(stream&&stream.getTracks)stream.getTracks().forEach(t=>t.stop())}catch(e){}setTimeout(()=>{if(history.length>1){history.back()}else{location.href='about:blank'}},120)};
})();
