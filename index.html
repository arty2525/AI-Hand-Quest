{q:'หลังจากเลือก TensorFlow.js ในหน้า Export Model ต้องเลือกอะไรเพื่อให้ได้ URL ของโมเดล?',a:[['Upload my model','☁️',1],['Delete my model','🗑️',0],['Print my model','🖨️',0]],e:'เมื่อ Upload โมเดลแล้ว Teachable Machine จะสร้าง URL สำหรับนำไปใช้'},
{q:'ในระบบนี้ ESP32 DevKit V1 ทำหน้าที่หลักอะไร?',a:[['เป็น Web Server และควบคุม LED','🖥️',1],['ฝึกโมเดล AI ด้วยตัวเอง','🧠',0],['สร้างภาพจากกล้องด้วยตัวเอง','📷',0]],e:'ESP32 เก็บหน้าเว็บ รับคำสั่ง และควบคุม LED ไม่ได้ประมวลผลโมเดล Teachable Machine เอง'},

{q:'หลังอัปโหลดโปรแกรมลง ESP32 ควรดูข้อมูลใดใน Serial Monitor เพื่อนำไปเปิดหน้าเว็บ?',a:[['IP Address ของ ESP32','🌐',1],['หมายเลขขา LED เท่านั้น','💡',0],['จำนวน Class ของ AI เท่านั้น','🤖',0]],e:'Serial Monitor จะแสดง IP ของ ESP32 สำหรับเปิดหน้าเว็บใน Browser'}];
const C=[[0,1],[1,2],[2,3],[3,4],[0,5],[5,6],[6,7],[7,8],[5,9],[9,10],[10,11],[11,12],[9,13],[13,14],[14,15],[15,16],[13,17],[17,18],[18,19],[19,20],[0,17]];
let state='START',lv=0,score=0,cards=[],zone={},btn={},lm=null,hand=false,tx=0,ty=0,sx=0,sy=0,pinch=false,prev=false,grab=null,lock=false,pActive=false,px=0,py=0,pGrab=null,control='Mouse',cameraOk=false,feedback=null,feedbackUntil=0,audioOn=true,hands,camera,cursor='normal',cursorUntil=0,conf=[];
const ON=.055,OFF=.075;function W(){return wrap.getBoundingClientRect().width}function H(){return wrap.getBoundingClientRect().height}function resize(){const r=wrap.getBoundingClientRect(),d=Math.min(devicePixelRatio||1,2);canvas.width=r.width*d;canvas.height=r.height*d;canvas.style.width=r.width+'px';canvas.style.height=r.height+'px';ctx.setTransform(d,0,0,d,0,0);zone={x:r.width*.22,y:r.height*.75,w:r.width*.56,h:r.height*.16}}addEventListener('resize',resize);resize();
function rr(x,y,w,h,r){r=Math.min(r,w/2,h/2);ctx.beginPath();ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath()}function inside(x,y,r){return x>=r.x&&x<=r.x+r.w&&y>=r.y&&y<=r.y+r.h}function glass(x,y,w,h,r=22,a=.58){ctx.save();rr(x,y,w,h,r);ctx.fillStyle=`rgba(15,23,42,${a})`;ctx.fill();ctx.strokeStyle='#ffffff28';ctx.lineWidth=1.2;ctx.stroke();ctx.restore()}function wrapText(t,x,y,m,l,n=3){let out=[],line='';for(const w of t.split(' ')){const z=line?line+' '+w:w;if(ctx.measureText(z).width>m&&line){out.push(line);line=w}else line=z}if(line)out.push(line);out.slice(0,n).forEach((s,i)=>ctx.fillText(s,x,y+i*l))}
function shuffle(a){a=[...a];for(let i=a.length-1;i;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}function load(){const d=L[lv],w=W(),h=H(),cw=Math.min(250,w*.25),ch=Math.min(170,h*.26),g=Math.max(14,w*.025),total=cw*3+g*2,x=(w-total)/2,y=h*.36;cards=shuffle(d.a).map((a,i)=>({t:a[0],em:a[1],ok:!!a[2],x:x+i*(cw+g),y,w:cw,h:ch,ox:x+i*(cw+g),oy:y,drag:0,ph:Math.random()*6.28}));feedback=null;grab=pGrab=null;lock=false}function resetCard(c){c.x=c.ox;c.y=c.oy;c.drag=0}function top(x,y){for(let i=cards.length-1;i>=0;i--)if(inside(x,y,cards[i]))return cards[i];return null}

function answer(c){if(lock)return;if(c.ok){lock=true;score+=100;feedback={ok:1,t:'ถูกต้อง! +100 คะแนน',e:L[lv].e};feedbackUntil=performance.now()+1400;tone('correct');cursor='grab';cursorUntil=performance.now()+450;setTimeout(()=>{lv++;if(lv>=L.length){state='FINISHED';conf=Array.from({length:90},()=>({x:Math.random()*W(),y:-Math.random()*H(),vx:(Math.random()-.5)*3,vy:2+Math.random()*4,r:3+Math.random()*5,h:Math.random()*360}));tone('finish')}else load()},1400)}else{feedback={ok:0,t:'ยังไม่ถูก ลองอีกครั้ง!',e:''};feedbackUntil=performance.now()+800;tone('wrong');resetCard(c)}}function release(c){if(!c)return;c.drag=0;inside(c.x+c.w/2,c.y+c.h/2,zone)?answer(c):resetCard(c)}
async function init(){loading.classList.remove('hidden');start.classList.add('hidden');try{hands=new Hands({locateFile:f=>`https://cdn.jsdelivr.net/npm/@mediapipe/hands/${f}`});hands.setOptions({maxNumHands:1,modelComplexity:1,minDetectionConfidence:.6,minTrackingConfidence:.6,selfieMode:false});hands.onResults(res=>{if(res.multiHandLandmarks&&res.multiHandLandmarks.length){lm=res.multiHandLandmarks[0];hand=true;const i=lm[8],t=lm[4];tx=(1-i.x)*W();ty=i.y*H();const dx=t.x-i.x,dy=t.y-i.y,d=Math.sqrt(dx*dx+dy*dy);if(!pinch&&d<ON)pinch=true;else if(pinch&&d>OFF)pinch=false}else{lm=null;hand=false;pinch=false}});camera=new Camera(video,{onFrame:async()=>{if(hands&&video.readyState>=2)await hands.send({image:video})},width:1280,height:720});await camera.start();cameraOk=true}catch(e){cameraOk=false;warn.classList.remove('hidden');warn.textContent='⚠️ เปิดกล้องไม่สำเร็จ แต่ยังเล่นด้วย Mouse/Touch ได้'}finally{loading.classList.add('hidden');state='INSTRUCTION'}}document.getElementById('startBtn').onclick=init;
function handUpdate(){if(!hand||pActive||lock){prev=pinch;return}sx+=(tx-sx)*.3;sy+=(ty-sy)*.3;control='Hand';let h=null;if(state==='INSTRUCTION')h=inside(sx,sy,btn)?btn:null;else if(state==='PLAYING')h=top(sx,sy);if(performance.now()>cursorUntil)cursor=h?'hover':'normal';const down=pinch&&!prev,up=!pinch&&prev;if(down){if(state==='INSTRUCTION'&&h){state='PLAYING';lv=0;score=0;load();cursor='grab';cursorUntil=performance.now()+400}else if(state==='PLAYING'){const c=top(sx,sy);if(c){grab=c;c.drag=1;cursor='grab';cursorUntil=performance.now()+400}else{cursor='miss';cursorUntil=performance.now()+400}}else if(state==='FINISHED'&&inside(sx,sy,btn)){state='PLAYING';lv=0;score=0;load()}}if(grab&&pinch){grab.x=sx-grab.w/2;grab.y=sy-grab.h/2}if(up&&grab){release(grab);grab=null}prev=pinch}

function backdrop(){const w=W(),h=H();if(!cameraOk){const g=ctx.createLinearGradient(0,0,w,h);g.addColorStop(0,'#07152e');g.addColorStop(1,'#28114c');ctx.fillStyle=g;ctx.fillRect(0,0,w,h)}else{ctx.fillStyle='#02061738';ctx.fillRect(0,0,w,h)}}function handDraw(){if(!lm||pActive)return;ctx.save();ctx.lineWidth=3;ctx.strokeStyle='#22d3eedd';ctx.shadowColor='#22d3ee';ctx.shadowBlur=10;for(const [a,b] of C){ctx.beginPath();ctx.moveTo((1-lm[a].x)*W(),lm[a].y*H());ctx.lineTo((1-lm[b].x)*W(),lm[b].y*H());ctx.stroke()}ctx.shadowBlur=0;for(let i=0;i<lm.length;i++){ctx.beginPath();ctx.arc((1-lm[i].x)*W(),lm[i].y*H(),i==4||i==8?6:4,0,6.28);ctx.fillStyle=i==4||i==8?'#fde047':'#67e8f9';ctx.fill()}ctx.restore()}function cursorDraw(){if(!hand||pActive)return;ctx.save();ctx.lineWidth=4;ctx.shadowBlur=14;ctx.strokeStyle=cursor==='hover'?'#fde047':cursor==='miss'?'#ef4444':cursor==='grab'?'#22c55e':'#38bdf8';ctx.shadowColor=ctx.strokeStyle;if(cursor==='hover')ctx.setLineDash([8,7]);ctx.beginPath();ctx.arc(sx,sy,20,0,6.28);ctx.stroke();ctx.setLineDash([]);if(cursor==='grab'){ctx.fillStyle='#fff';ctx.font='bold 18px sans-serif';ctx.textAlign='center';ctx.fillText('✓',sx,sy+6)}ctx.restore()}
